<!DOCTYPE html>
<!--
  Root HTML template for the single-page web build (web.output: "single").
  Expo injects the bundle script at the end of the body (so never write the
  literal closing body/head tags in this comment). Service worker registration
  lives in app/_layout.jsx because it depends on NODE_ENV.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, shrink-to-fit=no, viewport-fit=cover" />
    <title>ClickPrint</title>

    <!-- PWA. This file is served as-is by the dev server, so it carries the
         dev manifest/title ("ClickPrintDev"). `npm run build:web` rewrites
         both to the production values in dist/index.html. -->
    <link rel="manifest" href="/manifest-dev.json" />
    <!-- Status bar color on an installed PWA. Light -> dark status-bar text.
         Keep in sync with colors.background (constants/colors.js). -->
    <meta name="theme-color" content="#F7F8FA" />
    <!-- Force light rendering so a dark-mode device doesn't darken the
         system nav bar or draw a dark seam under the status bar. -->
    <meta name="color-scheme" content="light" />

    <!-- iOS home-screen / standalone support -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="ClickPrintDev" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <!-- Icons -->
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />

    <style id="expo-reset">
      /* react-native-web reset: full-height root, no body scroll so
         ScrollView components behave the same as on native. */
      html,
      body {
        height: 100%;
      }
      body {
        overflow: hidden;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
      /* Match the Android system nav bar on an installed PWA to the app. */
      :root {
        color-scheme: light;
      }
      html,
      body {
        margin: 0;
        background-color: #F7F8FA;
      }

      /* ── Global: disable text selection everywhere except form fields ── */
      * {
        -webkit-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      input, textarea, [contenteditable="true"] {
        -webkit-user-select: text;
        -moz-user-select: text;
        -ms-user-select: text;
        user-select: text;
      }

      /* ── Global: disable zoom via touch-action ── */
      html {
        touch-action: pan-x pan-y;
        -ms-touch-action: pan-x pan-y;
      }
    </style>

    <script>
      // Capture the install prompt as early as possible. The
      // `beforeinstallprompt` event can fire before React mounts, so we stash
      // it on window and re-broadcast a custom event InstallScreen listens for.
      window.__bipEvent = null;
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        window.__bipEvent = e;
        window.dispatchEvent(new Event('bip-ready'));
      });
      window.addEventListener('appinstalled', function () {
        window.__bipEvent = null;
      });

      // ── Prevent zoom gestures ──────────────────────────────────────────
      // 1. Block pinch-to-zoom (multi-touch gesture)
      document.addEventListener('touchmove', function (e) {
        if (e.touches.length > 1) { e.preventDefault(); }
      }, { passive: false });

      // 2. Block Ctrl/Cmd + scroll-wheel zoom
      document.addEventListener('wheel', function (e) {
        if (e.ctrlKey || e.metaKey) { e.preventDefault(); }
      }, { passive: false });

      // 3. Block Ctrl/Cmd + plus/minus/zero keyboard zoom
      document.addEventListener('keydown', function (e) {
        if ((e.ctrlKey || e.metaKey) && (e.key === '+' || e.key === '-' || e.key === '=' || e.key === '0')) {
          e.preventDefault();
        }
      });

      // 4. Block double-tap zoom on touch devices
      (function () {
        var lastTap = 0;
        document.addEventListener('touchend', function (e) {
          var now = Date.now();
          if (now - lastTap < 300) { e.preventDefault(); }
          lastTap = now;
        }, { passive: false });
      })();

      // 5. Block long-press context menu (the "Web Search" popup)
      document.addEventListener('contextmenu', function (e) {
        var tag = e.target && e.target.tagName;
        if (tag !== 'INPUT' && tag !== 'TEXTAREA') { e.preventDefault(); }
      });
    </script>
  </head>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
